name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract source zip (agar repo me sirf zip hai)
        run: |
          Z=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$Z" ] && [ ! -f pubspec.yaml ]; then
            echo "Extracting $Z ..."
            unzip -q -o "$Z" -d src_extracted
          fi

      - name: Find Flutter project folder
        id: proj
        run: |
          P=$(find . -maxdepth 4 -name pubspec.yaml -not -path "*/.*" | head -n 1)
          if [ -z "$P" ]; then
            echo "pubspec.yaml nahi mili. Repo files:"
            find . -maxdepth 3 -type f | head -80
            exit 1
          fi
          DIR=$(dirname "$P")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Project folder: $DIR"

      - name: Fix Android Gradle / AGP / Kotlin for Flutter stable 3.47+
        working-directory: ${{ steps.proj.outputs.dir }}/android
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's#gradle-[0-9.]*-all.zip#gradle-8.14.3-all.zip#; s#gradle-[0-9.]*-bin.zip#gradle-8.14.3-bin.zip#' gradle/wrapper/gradle-wrapper.properties
            grep -n "distributionUrl" gradle/wrapper/gradle-wrapper.properties || true
          fi
          if [ -f settings.gradle.kts ]; then
            sed -i 's#id("com.android.application") version "[0-9.]*"#id("com.android.application") version "8.11.1"#' settings.gradle.kts
            sed -i 's#id("org.jetbrains.kotlin.android") version "[0-9.]*"#id("org.jetbrains.kotlin.android") version "2.2.20"#' settings.gradle.kts
            grep -nE 'com.android.application|kotlin.android' settings.gradle.kts || true
          fi

      - name: Flutter pub get
        working-directory: ${{ steps.proj.outputs.dir }}
        run: flutter pub get

      - name: Build release APK (arm64 + universal)
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          flutter build apk --release --android-skip-build-dependency-validation
          flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      - name: Verify APK integrity
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          APK_DIR=build/app/outputs/flutter-apk
          ls -lh "$APK_DIR"
          for f in "$APK_DIR"/*.apk; do
            echo "Testing $f ..."
            unzip -t "$f" > /tmp/apk_test.txt 2>&1 || { cat /tmp/apk_test.txt; exit 1; }
            echo "OK: $f"
          done
          # Prefer arm64 for phones; fall back to universal
          if [ -f "$APK_DIR/app-arm64-v8a-release.apk" ]; then
            cp "$APK_DIR/app-arm64-v8a-release.apk" "$GITHUB_WORKSPACE/LudoRush.apk"
          else
            cp "$APK_DIR/app-release.apk" "$GITHUB_WORKSPACE/LudoRush.apk"
          fi
          ls -lh "$GITHUB_WORKSPACE/LudoRush.apk"
          file "$GITHUB_WORKSPACE/LudoRush.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ludo-rush-apk
          path: LudoRush.apk

      - name: Publish GitHub Release (direct APK download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ludo Rush APK v1.0.${{ github.run_number }}
          body: |
            Release build from GitHub Actions.
            Install **LudoRush.apk** directly (do not install from inside a zip).
          files: LudoRush.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
